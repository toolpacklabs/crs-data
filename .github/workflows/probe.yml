name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python -c "import requests; r=requests.get('https://www.canada.ca/content/dam/ircc/documents/json/ee_rounds_4_en.json', timeout=45); print(r.status_code, len(r.content), len(r.json()['rounds']))"
