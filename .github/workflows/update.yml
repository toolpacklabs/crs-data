name: update
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/selftest.py
      - run: python tools/replay.py
      - run: python tools/validate_rules.py data/rules.json
      - run: python tools/update.py
      - run: python tools/validate.py data/rounds.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "data: refresh draws $(date -u +%FT%TZ)"
            git push
          fi
